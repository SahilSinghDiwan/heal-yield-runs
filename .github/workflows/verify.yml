name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install git+https://github.com/SahilSinghDiwan/heal-yield@0dec69e
      - name: Verify every run directory
        run: |
          set -e
          for d in runs/*/; do heal-yield verify --run "$d"; done
